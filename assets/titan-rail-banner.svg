<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" fill="none">
  <defs>
    <linearGradient id="trGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="trTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="trGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="120" rx="16" fill="#0C0D12" stroke="#232634" stroke-width="1.5"/>

  <!-- Industrial Rail Icon Graphic -->
  <g transform="translate(36, 22)">
    <!-- Rail Tracks -->
    <path d="M 12 16 L 68 16" stroke="url(#trTrack)" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 56 L 68 56" stroke="url(#trTrack)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Sleepers / Ties -->
    <line x1="22" y1="12" x2="22" y2="60" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="12" x2="36" y2="60" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="12" x2="50" y2="60" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="12" x2="64" y2="60" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Central High-Velocity Locomotive Shield Core -->
    <polygon points="40,24 58,36 40,48 30,48 36,36 30,24" fill="url(#trGrad)" filter="url(#trGlow)" />
    <circle cx="42" cy="36" r="3" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="136" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="3" fill="#F8FAFC">TITAN<tspan fill="url(#trGrad)">RAIL</tspan></text>
  <text x="138" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="2.2" fill="#FB923C">ERP-TO-3PL RESILIENT LOGISTICS GATEWAY</text>

  <!-- Status Pill -->
  <g transform="translate(540, 42)">
    <rect width="148" height="34" rx="17" fill="#1C1924" stroke="#37304A" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4.5" fill="#EF4444" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" letter-spacing="0.8">MAKE BREAK DLQ</text>
  </g>
</svg>