[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titan-rail"
version = "1.0.0"
description = "Enterprise Resilient ERP-to-3PL Logistics Engine with Make builtin:Break DLQ & FastAPI Decision Gateway"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Akash Jadon", email = "akashjadon04@users.noreply.github.com" }]
requires-python = ">=3.9"
keywords = ["make", "integromat", "logistics", "erp", "3pl", "fastapi", "resilience", "dead-letter-queue", "idempotency"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "eval_type_backport>=0.2.0;python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/akashjadon04/titan-rail"
Issues = "https://github.com/akashjadon04/titan-rail/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/titan_rail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
